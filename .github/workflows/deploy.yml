name: Build and Deploy Next.js Site via FTP

on:
  # Trigger on pushes to the "development" branch
  push:
    branches: ["development"]

  # Allow manual triggers from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Step 4: Build the project in standalone mode
      - name: Build Next.js standalone
        run: yarn next build && yarn next export

      # Step 5: Prepare standalone build (remove node_modules from .next/standalone)
      - name: Clean up node_modules
        run: rm -rf .next/standalone/node_modules

      # Step 6: Archive the standalone folder
      - name: Archive build artifacts
        run: tar -czvf standalone-build.tar.gz -C .next/standalone .

      # Step 7: Upload artifact for deployment
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: standalone-build
          path: standalone-build.tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Step 1: Download the artifact
      - name: Download artifact
        uses: actions/download-artifact@v3
        with:
          name: standalone-build

      # Step 2: Extract the artifact
      - name: Extract artifact
        run: tar -xzvf standalone-build.tar.gz

      # Step 3: Deploy via FTP
      - name: Deploy to FTP Server
        uses: SamKirkland/FTP-Deploy-Action@v4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: .next/standalone
          server-dir: ${{secrets.FTP_DIR}}
