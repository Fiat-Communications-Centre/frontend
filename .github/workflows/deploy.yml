name: Build and Deploy Next.js Site to Server

on:
  # Trigger on pushes to the "development" branch
  push:
    branches: ["deploy"]

  # Allow manual triggers from the Actions tab
  workflow_dispatch:

# Configure permissions for deployment
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Step 4: Build the project in standalone mode
      - name: Build Next.js standalone
        run: yarn next build && yarn next export

      # Step 5: Prepare standalone build (remove node_modules from .next/standalone)
      - name: Clean up node_modules
        run: rm -rf .next/standalone/node_modules

      # Step 6: Archive the standalone folder
      - name: Archive build artifacts
        run: tar -czvf standalone-build.tar.gz -C .next/standalone .

      # Step 7: Upload the artifact for deployment
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: standalone-build
          path: standalone-build.tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Step 1: Download the artifact
      - name: Download artifact
        uses: actions/download-artifact@v3
        with:
          name: standalone-build
          path: ./standalone

      # Step 2: Transfer files to the server via FTP/SFTP
      - name: Deploy to Server
        uses: burnett01/rsync-deployments@5.2
        with:
          switches: "-avzr"
          path: ./standalone/
          remote_path: /path/to/server/target/directory
          remote_host: ${{ secrets.REMOTE_HOST }}
          remote_user: ${{ secrets.REMOTE_USER }}
          remote_key: ${{ secrets.REMOTE_SSH_KEY }}
